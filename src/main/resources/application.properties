spring.application.name=Athl_back
server.port=8080

# Aperçus de partage (voir ShareController) : og:url / og:image reprennent le domaine sur lequel le
# lien a été partagé s'il fait partie de app.site-hosts — le passage à www. est donc pris en compte
# tout seul. app.site-url ne sert que de repli pour une requête arrivée par un autre domaine.
app.site-url=${APP_SITE_URL:https://site.athl-logistique.com}
app.site-hosts=${APP_SITE_HOSTS:athl-logistique.com,www.athl-logistique.com,site.athl-logistique.com}


# ===== Database =====
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml


# ===== Mail =====
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE}


# ===== Cloudinary (upload d'images depuis le BO, voir CloudinaryConfig) =====
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
# Taille max acceptée par Cloudinary pour une image ou un PDF (10 Mo sur l'offre actuelle) :
# vérifiée par le back avant l'envoi (voir UploadServiceImpl) — à aligner avec MAX_UPLOAD_SIZE
# côté BO (core/services/cloudinary-upload.service.ts) si l'offre Cloudinary change.
app.upload.max-size=${APP_UPLOAD_MAX_SIZE:10MB}

# Plafond absolu d'une requête d'upload (vidéos comprises).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
