name: deploy athl back # Nom du process
on:
  push:
    branches:
      - develop   # ne se déclenche QUE quand on push sur develop
env:
  IMAGE: athl-back
  VERSION: 0.0.1-SNAPSHOT

jobs:
  create-folder: # crée un répertoire sur le serveur
    name: create folder
    runs-on: ubuntu-latest
    steps: # les étapes du job
      - name: execute commands
        uses: appleboy/ssh-action@v1
        with: # mettre les variables crée depuis github
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }} # la key
          port: 22 # le port pas default quand ce connect a un serveur
          script: | # on execute un ensemble de script
            mkdir -p /opt/application/athl/${{env.IMAGE}}
            ls -al /opt/application/athl

  generate-image: # générer mon image et push sur github
    name: generate image
    runs-on: ubuntu-latest
    needs: [ 'create-folder' ]
    steps: # les étapes du job
      - name: cloner le repertoire # étape 1 cloner le projet dans github
        uses: actions/checkout@v4
      - name: setup java version
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate and push image
        run: |
          ./mvnw clean package spring-boot:build-image \
          -Ddocker.publishRegistry.username=${{ secrets.DCK_USERNAME }} \
          -Ddocker.publishRegistry.password=${{ secrets.DCK_PASSWORD }} \
          -Dspring-boot.build-image.publish=true \
          -Dmaven.test.skip=true
  run-container:
    name: run container
    runs-on: ubuntu-latest
    needs: [ 'create-folder', 'generate-image' ]
    steps:
      - name: cloner le repertoire
        uses: actions/checkout@v4
      - name: copy file via ssh key
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          source: "compose.yaml"
          target: /opt/application/athl/${{env.IMAGE}}
      - name: execute commands to run container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          script: |
            echo DB_HOST="${{ secrets.DB_HOST }}" > /opt/application/athl/${{env.IMAGE}}/.env
            echo DB_USERNAME="${{ secrets.DB_USERNAME }}" >> /opt/application/athl/${{env.IMAGE}}/.env
            echo DB_PASSWORD="${{ secrets.DB_PASSWORD }}" >> /opt/application/athl/${{env.IMAGE}}/.env
            echo MAIL_HOST="${{ secrets.MAIL_HOST }}" >> /opt/application/athl/${{env.IMAGE}}/.env
            echo MAIL_PORT="${{ secrets.MAIL_PORT }}" >> /opt/application/athl/${{env.IMAGE}}/.env
            echo MAIL_USERNAME="${{ secrets.MAIL_USERNAME }}" >> /opt/application/athl/${{env.IMAGE}}/.env
            echo MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}" >> /opt/application/athl/${{env.IMAGE}}/.env
            docker compose -f /opt/application/athl/${{env.IMAGE}}/compose.yaml up -d
            # .env volontairement laissé en place (pas supprimé) : sinon un simple
            # "docker compose up -d" manuel sur le serveur, hors CI, recrée le conteneur
            # avec des variables vides et le fait planter.
